name: Kiem tra thoi tiet va gui thong bao day
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Goi /api/push-check
        env:
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "x-cron-key: $KEY" https://thoi-tiet-bay.vercel.app/api/push-check
