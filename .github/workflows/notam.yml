name: Lay NOTAM cong khai (FAA NOTAM Search)
# Đã thử 01/11/2026: FAA NOTAM Search trả HTTP 403 cho máy GitHub Actions → tắt lịch tự chạy, chỉ chạy tay để thử lại.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Lay NOTAM
        run: node scripts/fetch-notams.mjs
      - name: Commit neu thay doi
        run: |
          git config user.name "thoi-tiet-bay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notams
          if git diff --cached --quiet; then echo "Khong co thay doi"; else git commit -m "Cap nhat NOTAM $(date -u +%FT%H:%MZ)" && git pull --rebase -q && git push; fi
